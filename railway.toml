# Build from repo root. Set Dockerfile path per service in Railway UI:
# - api service: api/Dockerfile
# - back service: back/Dockerfile
[build]
builder = "dockerfile"
dockerfilePath = "api/Dockerfile"
watchPatterns = ["**"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
