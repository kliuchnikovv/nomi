name: PR Cleanup

on:
  pull_request:
    types: [closed]

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  cleanup:
    name: Cleanup Preview Environment
    runs-on: ubuntu-latest

    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Delete Preview Environment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          ENV_NAME="pr-${{ github.event.pull_request.number }}"
          
          echo "Deleting preview environment: $ENV_NAME"
          
          # Delete the environment (ignore errors if it doesn't exist)
          railway environment delete "$ENV_NAME" 2>/dev/null || \
            echo "Environment $ENV_NAME not found or already deleted"
          
          echo "✅ Cleanup complete"

      - name: Comment on PR
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            ## 🧹 Preview Environment Cleaned Up
            
            Environment `pr-${{ github.event.pull_request.number }}` has been deleted.
          comment_tag: preview-cleanup
          mode: recreate
