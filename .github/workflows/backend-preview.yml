name: Backend Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'api/**'
      - 'back/**'

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  deploy-preview:
    name: Deploy Preview Environment
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Create Preview Environment
        id: preview
        run: |
          # Create environment name from PR number
          ENV_NAME="pr-${{ github.event.pull_request.number }}"
          
          echo "Creating preview environment: $ENV_NAME"
          
          # Check if environment already exists, create if not
          railway environment --name "$ENV_NAME" 2>/dev/null || \
            railway environment create --name "$ENV_NAME"
          
          # Deploy API service
          cd api
          railway up --environment "$ENV_NAME" --detach
          API_URL=$(railway status --environment "$ENV_NAME" --json | jq -r '.url // empty')
          cd ..
          
          # Deploy Agent service  
          cd back
          railway up --environment "$ENV_NAME" --detach
          AGENT_URL=$(railway status --environment "$ENV_NAME" --json | jq -r '.url // empty')
          cd ..
          
          # Output URLs
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "agent_url=$AGENT_URL" >> $GITHUB_OUTPUT
          echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT

      - name: Comment on PR
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            ## 🚀 Backend Preview Deployed
            
            | Service | URL |
            |---------|-----|
            | **Go API** | ${{ steps.preview.outputs.api_url || 'Deploying...' }} |
            | **Python Agent** | ${{ steps.preview.outputs.agent_url || 'Deploying...' }} |
            
            **Environment:** `${{ steps.preview.outputs.env_name }}`
            
            > ⏱️ Preview will be destroyed when PR is closed.
            > 💤 Services sleep after 10min of inactivity.
          comment_tag: preview-deploy
          mode: recreate
