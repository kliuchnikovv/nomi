name: Backend Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'api/**'
      - 'back/**'

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  deploy-preview:
    name: Deploy Preview Environment
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Create Preview Environment
        id: preview
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Create environment name from PR number
          ENV_NAME="pr-${{ github.event.pull_request.number }}"
          
          echo "Creating preview environment: $ENV_NAME"
          
          # Create new environment (or switch to existing)
          railway environment new "$ENV_NAME" 2>/dev/null || \
            railway environment "$ENV_NAME"
          
          echo "Deploying API service..."
          cd api
          railway up --detach || echo "API deploy queued"
          cd ..
          
          echo "Deploying Agent service..."
          cd back
          railway up --detach || echo "Agent deploy queued"
          cd ..
          
          # Get project info
          echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "status=deployed" >> $GITHUB_OUTPUT

      - name: Comment on PR
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            ## 🚀 Backend Preview Deployed
            
            **Environment:** `${{ steps.preview.outputs.env_name }}`
            
            Services are deploying to Railway. Check [Railway Dashboard](https://railway.app) for URLs.
            
            > ⏱️ Preview will be destroyed when PR is closed.
            > 💤 Services sleep after 10min of inactivity.
          comment_tag: preview-deploy
          mode: recreate
