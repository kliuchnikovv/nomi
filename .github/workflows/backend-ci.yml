name: Backend CI

on:
  pull_request:
    paths:
      - 'api/**'
      - 'back/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  # ============================================
  # Go API Tests
  # ============================================
  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: api/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: api/coverage.out
          flags: go-api
        continue-on-error: true

  lint-go:
    name: Go Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: api/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.55.0
          working-directory: api

  # ============================================
  # Python Agent Tests
  # ============================================
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: back/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest -v --cov=src --cov-report=xml
        continue-on-error: true  # Tests may not exist yet

  lint-python:
    name: Python Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: back/requirements.txt

      - name: Install linters
        run: pip install flake8 black

      - name: Run flake8
        run: flake8 src/ --count --show-source --statistics --max-line-length=120
        continue-on-error: true

      - name: Check Black formatting
        run: black --check src/
        continue-on-error: true
