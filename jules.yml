# Jules Configuration
# This file configures the Jules AI agent environment

# Environment setup script (runs on VM init)
setup:
  script: scripts/setup_jules_env.sh

# Resource limits for the VM
resources:
  memory: 8GB
  timeout: 30m

# Files/directories to exclude from context (speeds up cloning)
exclude:
  - "front/node_modules"
  - "front/ios/Pods"
  - "front/android/.gradle"
  - "front/android/build"
  - "back/.venv"
  - "back/__pycache__"
  - "**/*.xcassets"
  - "**/*.png"
  - "**/*.jpg"
  - "**/*.gif"

# Test commands per component
tests:
  api:
    command: "cd api && go test ./..."
    on_change: "api/**/*.go"
  
  back:
    command: "cd back && pytest"
    on_change: "back/**/*.py"
  
  front:
    command: "cd front && npm run lint"
    on_change: "front/**/*.ts,front/**/*.tsx"

# Lint commands
lint:
  api:
    command: "cd api && golangci-lint run"
  back:
    command: "cd back && flake8 && black --check ."
  front:
    command: "cd front && npm run lint"
