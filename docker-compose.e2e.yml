# Compose override for the deterministic end-to-end regression suite.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
#
# Turns on the stub-brain (BRAIN_TEST_MODE=1) so magic inputs produce a fixed
# frame sequence with no real LLM calls, and supplies the dummy secrets / DSN
# the services need to boot without any real credentials:
#
#   - back constructs its RedisWorker eagerly (agent_factory -> Knowledge ->
#     PgVector), so it needs DB_DSN and a pgvector-capable Postgres image.
#   - back builds a Gemini model object at startup (no network call), so any
#     non-empty GOOGLE_API_KEY / GEMINI_API_KEY satisfies it; stub mode never
#     actually invokes it.
#   - api loads config.railway.yaml (RAILWAY_ENVIRONMENT=true in the base file)
#     which substitutes ENCRYPTION_KEY (must be 64 hex chars) and JWT_SECRET.
#
# All values here are throwaway test secrets — the stack handles no real data.
services:
  db:
    # Drop-in replacement for postgres:16-alpine that ships the `vector`
    # extension PgVector needs (CREATE EXTENSION vector).
    image: pgvector/pgvector:pg16

  back:
    environment:
      - BRAIN_TEST_MODE=1
      - DB_DSN=postgres://postgres:postgres@db:5432/nomi?sslmode=disable
      - GOOGLE_API_KEY=e2e-stub-key
      - GEMINI_API_KEY=e2e-stub-key

  api:
    environment:
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - JWT_SECRET=e2e-jwt-secret
