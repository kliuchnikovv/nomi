name: gmail
display_name: Gmail
description: Gmail integration for email management
version: 1.0.0

execution:
  type: server
  entry_points:
    server: ./server/tools.py

auth:
  type: oauth2
  oauth_config_key: google
  oidc_issuer_url: https://accounts.google.com
  permissions:
    - gmail:read
    - gmail:write

ui:
  icon: gmail
  description_short: Gmail integration for email management
  category: email

methods:
  - name: get_recent_emails
    description: Get recent emails from the user's Gmail inbox
    parameters:
      type: object
      properties:
        limit:
          type: integer
          default: 5
          description: Maximum number of emails to return
      required: []
  - name: search_emails
    description: Search user's Gmail inbox by query (same syntax as Gmail search box)
    parameters:
      type: object
      properties:
        query:
          type: string
          description: Search query
        max_results:
          type: integer
          default: 5
          description: Maximum number of results
      required: [query]
  - name: get_email
    description: Get full email content by message ID
    parameters:
      type: object
      properties:
        message_id:
          type: string
          description: Gmail message ID
      required: [message_id]
  - name: send_email
    description: Send an email from the user's Gmail account
    parameters:
      type: object
      properties:
        to:
          type: string
          description: Recipient email address
        subject:
          type: string
          description: Email subject
        body:
          type: string
          description: Email body
      required: [to, subject, body]
  - name: reply_email
    description: Reply to an existing email
    parameters:
      type: object
      properties:
        message_id:
          type: string
          description: Gmail message ID to reply to
        body:
          type: string
          description: Reply body
      required: [message_id, body]
  - name: create_draft
    description: Create a draft email
    parameters:
      type: object
      properties:
        to:
          type: string
        subject:
          type: string
        body:
          type: string
      required: [to, subject, body]

background_tasks:
  enabled: true

tools:
  include: true

storage:
  type: server
  encrypted: true
