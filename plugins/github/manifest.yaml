name: github
display_name: GitHub
description: GitHub integration for repository management, issues, and pull requests
version: 1.0.0

execution:
  type: server
  entry_points:
    server: ./server/tools.py

auth:
  # GitHub App (fine-grained, per-installation tokens minted from app id + key).
  # Permissions are granted at install time (Contents R/W, Pull requests R/W,
  # Metadata R), not via OAuth scopes. oauth_config_key kept for legacy fallback.
  type: github_app
  oauth_config_key: github

ui:
  icon: github
  description_short: GitHub integration for repository management
  category: development

methods:
  - name: list_repos
    description: List user's GitHub repositories
    parameters:
      type: object
      properties:
        limit:
          type: integer
          default: 30
          description: Maximum number of repositories to return
      required: []
  - name: get_repo
    description: Get details of a specific repository
    parameters:
      type: object
      properties:
        owner:
          type: string
          description: Repository owner (user or organization)
        repo:
          type: string
          description: Repository name
      required: [owner, repo]
  - name: list_commits
    description: List commits in a repository, most recent first
    parameters:
      type: object
      properties:
        repo:
          type: string
          description: Repository name (may be given as "owner/repo")
        owner:
          type: string
          description: Repository owner; resolved automatically from accessible repositories when omitted
        sha:
          type: string
          description: Branch, tag, or commit SHA to start from (defaults to the repo's default branch)
        path:
          type: string
          description: Only list commits that touch this file path
        limit:
          type: integer
          default: 10
      required: [repo]
  - name: list_issues
    description: List issues in a repository
    parameters:
      type: object
      properties:
        owner:
          type: string
        repo:
          type: string
        state:
          type: string
          enum: [open, closed, all]
          default: open
        limit:
          type: integer
          default: 10
      required: [owner, repo]
  - name: create_issue
    description: Create a new issue in a repository
    parameters:
      type: object
      properties:
        owner:
          type: string
        repo:
          type: string
        title:
          type: string
        body:
          type: string
        labels:
          type: array
          items:
            type: string
      required: [owner, repo, title]
  - name: list_pull_requests
    description: List pull requests in a repository
    parameters:
      type: object
      properties:
        owner:
          type: string
        repo:
          type: string
        state:
          type: string
          enum: [open, closed, all]
          default: open
        limit:
          type: integer
          default: 10
      required: [owner, repo]
  - name: get_file_content
    description: Get content of a file in a repository
    parameters:
      type: object
      properties:
        owner:
          type: string
        repo:
          type: string
        path:
          type: string
          description: File path within the repository
        ref:
          type: string
          description: Git reference (branch, tag, commit SHA)
          default: main
      required: [owner, repo, path]
  - name: create_or_update_file
    description: Create or update a file in a repository
    parameters:
      type: object
      properties:
        owner:
          type: string
        repo:
          type: string
        path:
          type: string
        content:
          type: string
          description: File content (will be base64 encoded)
        message:
          type: string
          description: Commit message
        branch:
          type: string
          default: main
        sha:
          type: string
          description: SHA of the file being replaced (required for updates)
      required: [owner, repo, path, content, message]
  - name: create_branch
    description: Create a new branch from another branch (default branch if unspecified)
    parameters:
      type: object
      properties:
        owner:
          type: string
        repo:
          type: string
        branch:
          type: string
          description: Name of the new branch
        from_branch:
          type: string
          description: Base branch to branch from (defaults to the repo's default branch)
      required: [owner, repo, branch]
  - name: create_pull_request
    description: Open a pull request from a head branch into the base branch
    parameters:
      type: object
      properties:
        owner:
          type: string
        repo:
          type: string
        title:
          type: string
        head:
          type: string
          description: Branch with your changes
        base:
          type: string
          description: Target branch (defaults to the repo's default branch)
        body:
          type: string
          description: Pull request description
      required: [owner, repo, title, head]

background_tasks:
  enabled: false

storage:
  type: server
  encrypted: true

tools:
  include: true
