name: ios_calendar
display_name: iOS Calendar
description: iOS native Calendar integration via EventKit for calendar management
version: 1.0.0

execution:
  type: client
  entry_points:
    client: ./client/executor.ts

auth:
  type: none

ui:
  icon: calendar
  description_short: iOS Calendar интеграция через EventKit
  category: calendar

methods:
  - name: get_events
    description: Get calendar events for a date range
    parameters:
      type: object
      properties:
        start_date:
          type: string
          description: ISO format start date
        end_date:
          type: string
          description: ISO format end date
        limit:
          type: integer
          default: 20
          description: Maximum number of events to return
        calendar:
          type: string
          description: Calendar identifier
      required: [start_date, end_date]

  - name: create_event
    description: Create a new calendar event
    parameters:
      type: object
      properties:
        title:
          type: string
          description: Event title
        start:
          type: string
          description: ISO format start time (e.g., "2024-01-01T10:00:00Z")
        end:
          type: string
          description: ISO format end time
        all_day:
          type: boolean
          default: false
          description: Whether the event is all-day
        location:
          type: string
          description: Event location
        notes:
          type: string
          description: Event notes/description
        url:
          type: string
          description: Event URL
        calendar:
          type: string
          description: Calendar identifier to add event to
      required: [title, start, end]

  - name: update_event
    description: Update an existing calendar event
    parameters:
      type: object
      properties:
        id:
          type: string
          description: Event identifier (EKEvent identifier)
        title:
          type: string
          description: New event title
        start:
          type: string
          description: New ISO format start time
        end:
          type: string
          description: New ISO format end time
        all_day:
          type: boolean
          description: Whether the event is all-day
        location:
          type: string
          description: New event location
        notes:
          type: string
          description: New event notes
        url:
          type: string
          description: New event URL
      required: [id]

  - name: delete_event
    description: Delete a calendar event
    parameters:
      type: object
      properties:
        id:
          type: string
          description: Event identifier to delete
      required: [id]

  - name: get_calendars
    description: Get list of available calendars
    parameters:
      type: object
      properties: {}

background_tasks:
  enabled: true
  system_events:
    - app_lifecycle

storage:
  type: client_only
  encrypted: true

tools:
  include: true
