name: calendar
display_name: Google Calendar
description: Google Calendar integration for calendar management
version: 1.0.0

execution:
  type: server
  entry_points:
    server: ./server/tools.py

auth:
  type: oauth2
  oauth_config_key: google
  oidc_issuer_url: https://accounts.google.com
  permissions:
    - calendar:read
    - calendar:write

ui:
  icon: calendar
  description_short: Google Calendar интеграция для работы с календарем
  category: calendar

methods:
  - name: get_upcoming_events
    description: Get upcoming events from the user's primary calendar
    parameters:
      type: object
      properties:
        max_results:
          type: integer
          default: 10
          description: Maximum number of events to return
      required: []
  - name: create_event
    description: Create a new calendar event
    parameters:
      type: object
      properties:
        summary:
          type: string
          description: Event title
        start_time:
          type: string
          description: ISO format start time
        end_time:
          type: string
          description: ISO format end time
      required: [summary, start_time, end_time]
  - name: list_calendars
    description: List user's calendars
    parameters:
      type: object
      properties: {}
      required: []

background_tasks:
  enabled: false

tools:
  include: true

storage:
  type: server
  encrypted: true
