id: 4
name: "ITERATE — edit after plan is built"
description: |
  Build a simple plan first (path 1 tasks).
  Then send a chat message asking to move a task to a different time.
  Expects the plan to update accordingly.
input_tasks:
  - text: "Morning run"
    chips:
      - type: time
        value: "07:30"
  - text: "Team standup"
    chips:
      - type: time
        value: "10:00"
clarification_answers: {}
iterate_message: "Move team standup to 11:30"
success_criteria:
  - "Plan is built successfully"
  - "After edit message, standup shows 11:30"
