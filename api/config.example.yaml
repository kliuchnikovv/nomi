server:
  port: 8080

database:
  host: "${DB_HOST:-localhost}"
  port: ${DB_PORT:-5432}
  user: "${DB_USER:-postgres}"
  password: "${DB_PASSWORD:-postgres}"
  dbname: "${DB_NAME:-postgres}"

oauth2:
  callback_base: "http://localhost:8080"
  providers:
    # Gmail plugin — dedicated Google Cloud project / OAuth client (separate moderation)
    google_gmail:
      client_id: "${GOOGLE_GMAIL_CLIENT_ID}"
      client_secret: "${GOOGLE_GMAIL_CLIENT_SECRET}"
      issuer_url: "https://accounts.google.com"
    # Calendar plugin — dedicated Google Cloud project / OAuth client (separate moderation)
    google_calendar:
      client_id: "${GOOGLE_CALENDAR_CLIENT_ID}"
      client_secret: "${GOOGLE_CALENDAR_CLIENT_SECRET}"
      issuer_url: "https://accounts.google.com"
    # Legacy combined Google client — kept for backward compatibility (unused once split)
    google:
      client_id: "${GOOGLE_CLIENT_ID}"
      client_secret: "${GOOGLE_CLIENT_SECRET}"
      issuer_url: "https://accounts.google.com"
      scopes:
        - "openid"
        - "https://www.googleapis.com/auth/userinfo.email"
        - "https://www.googleapis.com/auth/userinfo.profile"
    github:
      client_id: "${GITHUB_CLIENT_ID}"
      client_secret: "${GITHUB_CLIENT_SECRET}"

token:
  refresh_before_minutes: 5
  jwt_secret: "your-super-secret-key-change-in-production"
  encryption_key: "${ENCRYPTION_KEY:-00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff}"

github:
  webhook_secret: "${GITHUB_WEBHOOK_SECRET:-}"
  # GitHub App (fine-grained, per-installation tokens). Leave app_id empty to disable.
  # private_key accepts raw PEM or base64-encoded PEM (base64 avoids YAML newline issues).
  app_id: ${GITHUB_APP_ID:-0}
  private_key: "${GITHUB_APP_PRIVATE_KEY:-}"
  client_id: "${GITHUB_APP_CLIENT_ID:-}"
  client_secret: "${GITHUB_APP_CLIENT_SECRET:-}"
  app_slug: "${GITHUB_APP_SLUG:-}"

llm:
  base_url: "${LLM_BASE_URL:-http://localhost:7777}"

plugins:
  gmail:
    enabled: true
    state: {}
  calendar:
    enabled: false
    state:
      sync_window_days: 7
