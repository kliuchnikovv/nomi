server:
  port: ${PORT}

database:
  host: ${PGHOST}
  port: ${PGPORT}
  user: ${PGUSER}
  password: ${PGPASSWORD}
  dbname: ${PGDATABASE}

oauth2:
  callback_base: ${CALLBACK_BASE}
  providers:
    # Gmail plugin — dedicated Google Cloud project / OAuth client (separate moderation)
    google_gmail:
      client_id: ${GOOGLE_GMAIL_CLIENT_ID}
      client_secret: ${GOOGLE_GMAIL_CLIENT_SECRET}
      issuer_url: "https://accounts.google.com"
    # Calendar plugin — dedicated Google Cloud project / OAuth client (separate moderation)
    google_calendar:
      client_id: ${GOOGLE_CALENDAR_CLIENT_ID}
      client_secret: ${GOOGLE_CALENDAR_CLIENT_SECRET}
      issuer_url: "https://accounts.google.com"
    # Legacy combined Google client — kept for backward compatibility (unused once split)
    google:
      client_id: ${GOOGLE_CLIENT_ID}
      client_secret: ${GOOGLE_CLIENT_SECRET}
      redirect_url: ${GOOGLE_REDIRECT_URL}
      issuer_url: "https://accounts.google.com"
      scopes:
        - "openid"
        - "https://www.googleapis.com/auth/userinfo.email"
        - "https://www.googleapis.com/auth/userinfo.profile"
    github:
      client_id: ${GITHUB_CLIENT_ID}
      client_secret: ${GITHUB_CLIENT_SECRET}

token:
  refresh_before_minutes: 5
  jwt_secret: ${JWT_SECRET}
  encryption_key: ${ENCRYPTION_KEY}

llm:
  base_url: ${LLM_BASE_URL}

plugins:
  imap:
    enabled: false
    state:
      imap_host: ${IMAP_HOST}
      imap_port: ${IMAP_PORT}
      username: ${IMAP_USERNAME}
  gmail:
    enabled: true
    state: {}
  calendar:
    enabled: false
    state:
      sync_window_days: 7
