apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-controller
  namespace: genie-sandboxes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-controller
  namespace: genie-sandboxes
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-controller
  namespace: genie-sandboxes
subjects:
  - kind: ServiceAccount
    name: sandbox-controller
    namespace: genie-sandboxes
roleRef:
  kind: Role
  name: sandbox-controller
  apiGroup: rbac.authorization.k8s.io
