apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-controller
  namespace: genie-sandboxes
  labels:
    app: sandbox-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-controller
  template:
    metadata:
      labels:
        app: sandbox-controller
    spec:
      serviceAccountName: sandbox-controller
      containers:
        - name: controller
          image: genie/sandbox-controller:latest
          ports:
            - containerPort: 8090
              name: http
          env:
            - name: PORT
              value: "8090"
            - name: SANDBOX_NAMESPACE
              value: "genie-sandboxes"
            - name: IN_CLUSTER
              value: "true"
            - name: SANDBOX_IMAGE
              value: "ubuntu:22.04"
            - name: SANDBOX_INACTIVITY_TIMEOUT
              value: "15m"
            - name: SANDBOX_PVC_RETENTION_DAYS
              value: "30"
            - name: SANDBOX_MAX_CPU
              value: "1"
            - name: SANDBOX_MAX_MEMORY
              value: "512Mi"
            - name: SANDBOX_MAX_PODS
              value: "100"
            - name: SANDBOX_CONTROLLER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sandbox-controller-token
                  key: token
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
