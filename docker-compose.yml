services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SKIP_SWAG=1
      - PLUGINS_DIR=/app/plugins
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=nomi
      - PORT=8080
      - CALLBACK_BASE=http://localhost:8080
      - GOOGLE_REDIRECT_URL=http://localhost:8080/auth/google/callback
      - LLM_BASE_URL=http://back:8000
      - REDIS_URL=redis://redis:6379
      - RAILWAY_ENVIRONMENT=true
    depends_on:
      db:
        condition: service_healthy
      back:
        condition: service_healthy
    volumes:
      - ./config:/config:ro

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  back:
    build:
      context: .
      dockerfile: back/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgres://postgres:postgres@db:5432/nomi?sslmode=disable
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - REDIS_URL=redis://redis:6379
      - SANDBOX_CONTROLLER_URL=http://sandbox-sidecar:8090
      - SANDBOX_CONTROLLER_TOKEN=dev-token
    depends_on:
      db:
        condition: service_healthy
      sandbox-sidecar:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 60s

  # Railway Sandboxes backend — the agent sandbox runs in per-user isolated VMs.
  # Requires real Railway credentials in the environment below.
  sandbox-sidecar:
    build:
      context: ./sandbox-sidecar
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - SANDBOX_CONTROLLER_TOKEN=dev-token
      - SANDBOX_IDLE_TIMEOUT_MINUTES=30
      - RAILWAY_API_TOKEN=${RAILWAY_API_TOKEN}
      - RAILWAY_ENVIRONMENT_ID=${RAILWAY_ENVIRONMENT_ID}

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=nomi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
