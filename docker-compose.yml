services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SKIP_SWAG=1
      - PLUGINS_DIR=/app/plugins
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=genie
      - PORT=8080
      - CALLBACK_BASE=http://localhost:8080
      - GOOGLE_REDIRECT_URL=http://localhost:8080/auth/google/callback
      - LLM_BASE_URL=http://back:8000
      - REDIS_URL=redis://redis:6379
      - RAILWAY_ENVIRONMENT=true
    depends_on:
      db:
        condition: service_healthy
      back:
        condition: service_started
    volumes:
      - ./config:/config:ro

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  back:
    build:
      context: .
      dockerfile: back/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgres://postgres:postgres@db:5432/genie?sslmode=disable
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - REDIS_URL=redis://redis:6379
      - SANDBOX_CONTROLLER_URL=http://sandbox-controller:8090
      - SANDBOX_CONTROLLER_TOKEN=dev-token
    depends_on:
      db:
        condition: service_healthy
      sandbox-controller:
        condition: service_started

  sandbox-controller:
    build:
      context: ./sandbox-controller
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - SANDBOX_BACKEND=local
      - SANDBOX_CONTROLLER_TOKEN=dev-token
      - SANDBOX_ROOT=/sandboxes
      - SANDBOX_UID=1000
      - SANDBOX_GID=1000
      - SANDBOX_INACTIVITY_TIMEOUT=15m
      - SANDBOX_MAX_PODS=10
    volumes:
      - sandbox_workspaces:/sandboxes

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=genie
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  sandbox_workspaces:
